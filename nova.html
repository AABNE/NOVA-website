<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI by AussieAviationBNE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b0f;
    --surface: #0e1318;
    --border: #1a2230;
    --accent: #00e5ff;
    --accent2: #7b2fff;
    --text: #e8edf5;
    --text-dim: #5a6a7a;
    --user-bubble: #111827;
    --nova-bubble: #0a1628;
    --glow: 0 0 30px rgba(0,229,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(123,47,255,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,11,15,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    object-fit: cover;
    border-radius: 8px;
    background: none;
    box-shadow: none;
    font-size: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: #000;
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #chat {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 780px;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.nova { align-self: flex-start; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
  }

  .msg.nova .avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    box-shadow: 0 0 15px rgba(0,229,255,0.2);
  }

  .msg.user .avatar {
    background: var(--border);
    color: var(--text-dim);
  }

  .bubble {
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
    max-width: 680px;
    word-break: break-word;
  }

  .msg.nova .bubble {
    background: var(--nova-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-top-right-radius: 4px;
    color: var(--text);
  }

  .bubble img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
  }

  .bubble pre {
    background: #060a10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.6;
  }

  .bubble code {
    font-family: 'DM Mono', monospace;
    color: var(--accent);
  }

  .tag-label {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .tag-image { background: rgba(123,47,255,0.15); color: #a78bfa; border: 1px solid rgba(123,47,255,0.3); }
  .tag-code { background: rgba(0,229,255,0.1); color: var(--accent); border: 1px solid rgba(0,229,255,0.2); }
  .tag-math { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
  .tag-music { background: rgba(52,211,153,0.1); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
  .tag-joke { background: rgba(251,146,60,0.1); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }
  .tag-recipe { background: rgba(244,114,182,0.1); color: #f472b6; border: 1px solid rgba(244,114,182,0.2); }
  .tag-story { background: rgba(167,139,250,0.1); color: #a78bfa; border: 1px solid rgba(167,139,250,0.2); }
  .tag-advice { background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.2); }

  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    background: var(--nova-bubble);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-top-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  #input-area {
    position: relative;
    z-index: 10;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: rgba(8,11,15,0.95);
    backdrop-filter: blur(12px);
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
    max-width: 860px;
    margin: 0 auto;
  }

  .input-wrap:focus-within {
    border-color: rgba(0,229,255,0.3);
    box-shadow: 0 0 20px rgba(0,229,255,0.08);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    max-height: 160px;
    min-height: 24px;
  }

  #user-input::placeholder { color: var(--text-dim); }

  #send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 15px rgba(0,229,255,0.2);
  }

  #send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,229,255,0.35); }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #send-btn svg { width: 16px; height: 16px; fill: #000; }

  .footer-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    animation: fadeUp 0.5s ease forwards;
  }

  .welcome h1 {
    font-family: 'Syne', sans-serif;
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }

  .welcome p {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 32px;
    line-height: 1.7;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 600px;
    margin: 0 auto;
  }

  .suggestion {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    background: var(--surface);
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .suggestion:hover {
    border-color: rgba(0,229,255,0.3);
    color: var(--accent);
    background: rgba(0,229,255,0.05);
  }

  .error-msg {
    color: #f87171;
    font-size: 13px;
    padding: 10px 16px;
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    #chat { padding: 20px 12px; }
    #input-area { padding: 12px; }
    .welcome h1 { font-size: 28px; }
  }
</style>
</head>

function showLoggedIn(user) {
  // update header with user info
  const header = document.querySelector("header");
  const userDiv = document.createElement("div");
  userDiv.style.cssText = "display:flex;align-items:center;gap:10px;";
  userDiv.innerHTML = `
    ${user.avatar ? `<img src="${user.avatar}" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--border)"/>` : ""}
    <span style="font-size:13px;color:var(--text-dim)">${user.username}</span>
    <a href="/logout" style="font-size:12px;color:var(--text-dim);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:6px;">Logout</a>
  `;
  header.appendChild(userDiv);

  input.disabled = false;
  sendBtn.disabled = false;
  input.placeholder = "Message Nova...";

  // set system prompt
  history = [{
    role: "system",
    content: `You are Nova, a jack of all trades AI assistant.
You were created by AussieAviationBNE.
The person talking to you is ${user.username}.
${user.username} is NOT your creator — AussieAviationBNE made you.
If asked who made you say AussieAviationBNE.
Never say you were made by Meta, Groq, OpenAI, Ollama or anyone else.
Do NOT introduce yourself every message, only the first time.

Tags to use at the start of your reply:
IMAGE: <detailed prompt> → user wants an image
CODE: <lang>\n<code>\nEND_CODE\n<explanation> → user wants code
MATH: <solution> → math problem
MUSIC: <songs> → song recommendations
JOKE: <joke> → user wants a joke
RECIPE: <steps> → cooking question
TRANSLATE: <translation> → translate something
ADVICE: <advice> → life advice
STORY: <story> → creative writing
For anything else reply normally.`
  }];
}

async function loadHistory() {
  try {
    const res = await fetch("/history", { credentials: "include" });
    const messages = await res.json();

    if (messages.length > 0) {
      removeWelcome();
      for (const msg of messages) {
        appendMessage(msg.role === "user" ? "user" : "nova", msg.content);
        if (msg.role !== "system") {
          history.push({ role: msg.role, content: msg.content });
        }
      }
    }
  } catch (e) {
    console.error("Failed to load history", e);
  }
}

function suggest(el) {
  if (!currentUser) return;
  input.value = el.textContent.slice(2).trim();
  input.focus();
  autoResize();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", autoResize);

function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

function removeWelcome() {
  const w = document.getElementById("welcome");
  if (w) w.remove();
}

function appendMessage(role, content) {
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";

  if (role === "nova") {
    avatar.textContent = "N";
  } else if (currentUser?.avatar) {
    const img = document.createElement("img");
    img.src = currentUser.avatar;
    img.style.cssText = "width:100%;height:100%;border-radius:8px;object-fit:cover;";
    avatar.appendChild(img);
  } else {
    avatar.textContent = "U";
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (role === "nova") {
    bubble.innerHTML = formatNova(content);
  } else {
    bubble.textContent = content;
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function formatNova(text) {
  if (text.startsWith("IMAGE:")) {
    const prompt = text.slice(6).split("\n")[0].trim();
    const encoded = encodeURIComponent(prompt);
    const url = `https://image.pollinations.ai/prompt/${encoded}`;
    return `<div class="tag-label tag-image">🎨 Image</div><img src="${url}" alt="${prompt}" loading="lazy"/>`;
  }
  if (text.startsWith("CODE:")) {
    const lines = text.split("\n");
    const lang = lines[0].slice(5).trim();
    let code = [], explanation = [], inCode = true;
    for (let i = 1; i < lines.length; i++) {
      if (lines[i].trim() === "END_CODE") { inCode = false; continue; }
      if (inCode) code.push(lines[i]);
      else explanation.push(lines[i]);
    }
    const exp = explanation.join("\n").trim();
    return `<div class="tag-label tag-code">💻 ${lang || "Code"}</div><pre><code>${escHtml(code.join("\n"))}</code></pre>${exp ? `<br>${escHtml(exp)}` : ""}`;
  }
  if (text.startsWith("MATH:")) return `<div class="tag-label tag-math">🧮 Math</div>${escHtml(text.slice(5).trim())}`;
  if (text.startsWith("MUSIC:")) return `<div class="tag-label tag-music">🎵 Playlist</div>${escHtml(text.slice(6).trim())}`;
  if (text.startsWith("JOKE:")) return `<div class="tag-label tag-joke">😂 Joke</div>${escHtml(text.slice(5).trim())}`;
  if (text.startsWith("RECIPE:")) return `<div class="tag-label tag-recipe">🍳 Recipe</div>${escHtml(text.slice(7).trim())}`;
  if (text.startsWith("TRANSLATE:")) return `<div class="tag-label tag-advice">🌍 Translation</div>${escHtml(text.slice(10).trim())}`;
  if (text.startsWith("ADVICE:")) return `<div class="tag-label tag-advice">💡 Advice</div>${escHtml(text.slice(7).trim())}`;
  if (text.startsWith("STORY:")) return `<div class="tag-label tag-story">📖 Story</div>${escHtml(text.slice(6).trim())}`;
  return escHtml(text).replace(/\n/g, "<br>");
}

function escHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showTyping() {
  const msg = document.createElement("div");
  msg.className = "msg nova";
  msg.id = "typing";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "N";
  const indicator = document.createElement("div");
  indicator.className = "typing-indicator";
  indicator.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
  msg.appendChild(avatar);
  msg.appendChild(indicator);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isProcessing || !currentUser) return;

  removeWelcome();
  isProcessing = true;
  sendBtn.disabled = true;
  input.value = "";
  input.style.height = "auto";

  appendMessage("user", text);
  history.push({ role: "user", content: text });
  showTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: OLLAMA_MODEL, messages: history })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const reply = data.message.content.trim();

    history.push({ role: "assistant", content: reply });
    hideTyping();
    appendMessage("nova", reply);

  } catch (err) {
    hideTyping();
    const errMsg = document.createElement("div");
    errMsg.className = "msg nova";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "N";
    const bubble = document.createElement("div");
    bubble.className = "bubble error-msg";
    bubble.textContent = `⚠️ Error: ${err.message}`;
    errMsg.appendChild(avatar);
    errMsg.appendChild(bubble);
    chat.appendChild(errMsg);
    chat.scrollTop = chat.scrollHeight;
  }

  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

init();

  }
</script>

</html>
